name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test backend services
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test parent POM
        shell: pwsh
        run: .\backend\auth-service\mvnw.cmd -f .\build\service-parent\pom.xml clean install -DskipTests

      - name: Build and test every backend service
        shell: pwsh
        run: .\scripts\test-all.ps1
