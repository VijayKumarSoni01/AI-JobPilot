spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:authservice;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test-auth-service-secret-key-that-is-at-least-32-bytes
  expiration: 900000
  refresh-expiration: 2592000000

server:
  port: 0
