spring:
  application:
    name: ai-jobpilot-auth-service

  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${AUTH_SERVICE_PORT:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:change-me-in-production-auth-service-secret-key}
  expiration: ${JWT_EXPIRATION_TIME:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_TIME:2592000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info