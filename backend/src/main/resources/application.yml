spring:
  application:
    name: ai-jobpilot

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_TIME}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_TIME:2592000000}

management:
  endpoints:
    web:
      exposure:
        include: health,info